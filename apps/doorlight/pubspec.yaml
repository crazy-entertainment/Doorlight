name: sybl
description: "A calm, private Jami client for close friends and family."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  characters: 1.4.1
  flutter:
    sdk: flutter

  # Persist UI preferences and durable friend-selection pointers. Jami remains
  # authoritative for identities, contacts, conversations, and message history.
  shared_preferences: ^2.3.2
  local_auth: 3.0.2
  # Standards-based SHA-256 for Android-side clipboard consent binding. The
  # Windows host uses BCrypt; neither side carries a home-grown hash.
  crypto: ^3.0.7
  # Standards-compliant, offline QR rendering for canonical `jami:` identity
  # URIs. This is display-only on Windows; Jami does not support desktop QR
  # scanning.
  pretty_qr_code: ^3.6.0
  mobile_scanner: 7.4.2
  share_plus: 13.3.0
  # Opens WhatsApp/Telegram/mail share links on desktop through the
  # url_launcher platform plugins share_plus already bundles.
  url_launcher_platform_interface: 2.3.2
  # Decode, crop, orient, resize, and JPEG-encode profile pictures locally.
  # No profile image is sent through a third-party service.
  image: ^4.5.4
  # Native playback for received voice/audio attachments on Android + Windows.
  audioplayers: ^6.8.1
  record: 7.1.1
  record_android: 2.2.0
  record_windows: 2.3.0
  # Desktop decodes a friend's QR locally from a picked screenshot/photo or
  # the live webcam preview (zxing2 is pure Dart, nothing leaves the device).
  file_selector: ^1.1.0
  zxing2: ^0.2.4
  # Windows-only webcam preview; Android keeps mobile_scanner.
  camera_windows: ^0.3.0
  camera_platform_interface: ^2.14.0
  # /gravity easter egg rigid bodies. 0.14.x is the last pure-Dart line;
  # 0.15 builds native Box2D through code-asset hooks.
  forge2d: 0.14.2+1

dependency_overrides:
  shared_preferences_windows:
    path: third_party/shared_preferences_windows
  record_android:
    path: third_party/record_android
  record_windows:
    path: third_party/record_windows

dev_dependencies:
  file: 7.0.1
  path_provider_windows: 2.3.0
  path_provider_platform_interface: 2.1.3
  shared_preferences_windows: 2.4.1
  shared_preferences_platform_interface: 2.4.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/companion-links.json
    - assets/brand/
    - assets/gifs/doorlight/
    - assets/fonts/OFL-Fraunces.txt
    - assets/fonts/OFL-HankenGrotesk.txt
    - assets/fonts/OFL-Anton.txt
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-Caveat.txt
    - assets/fonts/OFL-CourierPrime.txt
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-GochiHand.txt
    - assets/fonts/OFL-InstrumentSerif.txt
    - assets/fonts/OFL-LilitaOne.txt
    - assets/fonts/OFL-Pacifico.txt
    - assets/fonts/OFL-PlayfairDisplay.txt
    - assets/fonts/OFL-Quicksand.txt
    - assets/fonts/OFL-Righteous.txt
    - assets/fonts/OFL-Rubik.txt
    - assets/fonts/OFL-Silkscreen.txt
    - assets/fonts/OFL-SpaceMono.txt
    - assets/fonts/OFL-VT323.txt
    - assets/sounds/
    - assets/stickers/manifest.json
    - assets/stickers/chubby_cats/

  # Nearby reveal: bends the captured screen as the sonar wavefront passes.
  shaders:
    - shaders/sonar_warp.frag

  # Bundled OFL variable fonts; provenance is in docs/COMPLIANCE.md. Keeping the
  # exact assets local makes typography deterministic and preserves offline use.
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    # Onboarding word reel: each spinning word wears its own face.
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
    - family: GochiHand
      fonts:
        - asset: assets/fonts/GochiHand-Regular.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous-Regular.ttf
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
