org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Preserve the app's explicit arm64-v8a filter. Flutter 3.44 otherwise replaces
# defaultConfig.ndk.abiFilters with every Flutter-supported ABI during configuration.
disable-abi-filtering=true
# Kotlin incremental compilation cannot close its .tab caches on this Windows setup (FilePageCache lock),
# which crashes :shared_preferences_android:compileDebugKotlin. Disable incremental — full compiles are
# reliable here and the modules are small.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
